<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PoliCita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════
       CSS VARIABLES & THEME
    ═══════════════════════════════════════════ */
    :root {
      --font-body: 'DM Sans', sans-serif;
      --font-display: 'Instrument Serif', serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-primary: #faf9f7;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f0eeeb;
      --bg-user-msg: #1a2b3d;
      --bg-agent-msg: #ffffff;
      --bg-code: #1c1e26;
      --bg-code-inline: #f0eeeb;
      --bg-input: #ffffff;
      --bg-header: rgba(250,249,247,0.85);
      --border-primary: #e5e2dd;
      --border-input: #d4d0ca;
      --border-input-focus: #6b8aad;
      --text-primary: #1a1a1a;
      --text-secondary: #6b6560;
      --text-muted: #9a9590;
      --text-user-msg: #ffffff;
      --text-agent-msg: #2a2a2a;
      --text-code: #e4e4e7;
      --text-link: #4a7a9b;
      --accent: #4a7a9b;
      --accent-hover: #3a6a8b;
      --accent-soft: rgba(74,122,155,0.1);
      --danger: #c44;
      --scrollbar-thumb: #ccc8c2;
      --scrollbar-track: transparent;
    }

    [data-theme="dark"] {
      --bg-primary: #131518;
      --bg-secondary: #1a1d22;
      --bg-tertiary: #22262c;
      --bg-user-msg: #2a4a6b;
      --bg-agent-msg: #1e2228;
      --bg-code: #0d0f12;
      --bg-code-inline: #282c34;
      --bg-input: #1a1d22;
      --bg-header: rgba(19,21,24,0.88);
      --border-primary: #2a2e35;
      --border-input: #363b44;
      --border-input-focus: #6b8aad;
      --text-primary: #e8e4df;
      --text-secondary: #8a8580;
      --text-muted: #5a5550;
      --text-user-msg: #e8e4df;
      --text-agent-msg: #d4d0ca;
      --text-code: #d4d0ca;
      --text-link: #7aaacb;
      --accent: #6b9bc0;
      --accent-hover: #7aaacb;
      --accent-soft: rgba(107,155,192,0.12);
      --danger: #e66;
      --scrollbar-thumb: #363b44;
      --scrollbar-track: transparent;
    }

    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 3px;
    }

    /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-header);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-primary);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background var(--transition), border-color var(--transition);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: #fff;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .header-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-primary);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      font-size: 1rem;
    }
    .icon-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border-color: var(--border-input);
    }

    /* ═══════════════════════════════════════════
       CHAT WINDOW
    ═══════════════════════════════════════════ */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .chat-container {
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      text-align: center;
      animation: fadeUp 0.6s ease-out;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      background: var(--accent-soft);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .welcome p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      max-width: 400px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════════
       MESSAGE BUBBLES
    ═══════════════════════════════════════════ */
    .message-row {
      display: flex;
      gap: 10px;
      animation: msgIn 0.25s ease-out;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .message-row.agent-row {
      justify-content: flex-start;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message {
      max-width: 85%;
      padding: 12px 18px;
      line-height: 1.65;
      font-size: 0.925rem;
      letter-spacing: 0.005em;
      transition: background var(--transition);
    }

    .user-msg {
      background: var(--bg-user-msg);
      color: var(--text-user-msg);
      border-radius: var(--radius-md) var(--radius-md) 6px var(--radius-md);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .agent-msg {
      background: var(--bg-agent-msg);
      color: var(--text-agent-msg);
      border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 6px;
      border: 1px solid var(--border-primary);
    }

    /* ═══════════════════════════════════════════
       AGENT MARKDOWN CONTENT
    ═══════════════════════════════════════════ */
    .agent-msg p { margin-bottom: 10px; }
    .agent-msg p:last-child { margin-bottom: 0; }

    .agent-msg ul, .agent-msg ol {
      margin: 10px 0 10px 22px;
    }
    .agent-msg li { margin-bottom: 5px; }
    .agent-msg li p { margin-bottom: 4px; }

    .agent-msg strong { font-weight: 600; }
    .agent-msg em { font-style: italic; }

    .agent-msg code {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      background: var(--bg-code-inline);
      padding: 2px 7px;
      border-radius: 5px;
      transition: background var(--transition);
    }

    .agent-msg .code-block-wrapper {
      position: relative;
      margin: 14px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-code);
    }

    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .code-lang {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .copy-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.5);
      font-family: var(--font-body);
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .copy-btn:hover {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      border-color: rgba(255,255,255,0.2);
    }
    .copy-btn.copied {
      color: #6bc07a;
      border-color: rgba(107,192,122,0.3);
    }

    .agent-msg pre {
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      line-height: 1.6;
      color: var(--text-code);
    }
    .agent-msg pre code {
      background: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
      border-radius: 0;
    }

    .agent-msg h1, .agent-msg h2, .agent-msg h3, .agent-msg h4 {
      font-family: var(--font-body);
      font-weight: 600;
      margin: 18px 0 8px;
      line-height: 1.3;
    }
    .agent-msg h1 { font-size: 1.15rem; }
    .agent-msg h2 { font-size: 1.08rem; }
    .agent-msg h3 { font-size: 1rem; }
    .agent-msg > :first-child { margin-top: 0; }

    .agent-msg blockquote {
      border-left: 3px solid var(--accent);
      padding: 4px 0 4px 14px;
      color: var(--text-secondary);
      margin: 10px 0;
      font-style: italic;
    }

    .agent-msg a {
      color: var(--text-link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color var(--transition);
    }
    .agent-msg a:hover { border-bottom-color: var(--text-link); }

    .agent-msg hr {
      border: none;
      border-top: 1px solid var(--border-primary);
      margin: 16px 0;
    }

    .agent-msg table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 0.875rem;
    }
    .agent-msg th, .agent-msg td {
      border: 1px solid var(--border-primary);
      padding: 8px 12px;
      text-align: left;
    }
    .agent-msg th {
      background: var(--bg-tertiary);
      font-weight: 600;
    }

    /* ═══════════════════════════════════════════
       TYPING INDICATOR
    ═══════════════════════════════════════════ */
    .typing-row {
      display: flex;
      gap: 10px;
      animation: msgIn 0.25s ease-out;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .typing-bubble {
      background: var(--bg-agent-msg);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 6px;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.35;
      animation: pulse 1.4s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 60%, 100% { transform: scale(1); opacity: 0.35; }
      30% { transform: scale(1.2); opacity: 0.9; }
    }

    /* ═══════════════════════════════════════════
       INPUT AREA
    ═══════════════════════════════════════════ */
    #input-area {
      padding: 16px;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-primary);
      transition: all var(--transition);
    }

    .input-container {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: var(--radius-lg);
      padding: 8px 8px 8px 20px;
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .input-wrapper:focus-within {
      border-color: var(--border-input-focus);
      box-shadow: var(--shadow-md), 0 0 0 3px var(--accent-soft);
    }

    #user-input {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.925rem;
      color: var(--text-primary);
      outline: none;
      resize: none;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
    }
    #user-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    #send-btn:hover { background: var(--accent-hover); transform: scale(1.04); }
    #send-btn:active { transform: scale(0.96); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #send-btn svg { width: 18px; height: 18px; }

    #stop-btn {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 14px;
      border: 2px solid var(--danger);
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    #stop-btn:hover {
      background: var(--danger);
      color: #fff;
    }
    #stop-btn svg { width: 16px; height: 16px; }
    #stop-btn.active { display: flex; }

    .input-hint {
      text-align: center;
      padding-top: 8px;
      font-size: 0.76rem;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    /* ═══════════════════════════════════════════
       MOBILE
    ═══════════════════════════════════════════ */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      #chat-window { padding: 16px 10px; }
      .message { max-width: 92%; font-size: 0.9rem; }
      .welcome { padding: 50px 16px 30px; }
      .welcome h1 { font-size: 1.6rem; }
      #input-area { padding: 12px; }
      .input-wrapper { padding: 6px 6px 6px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo-mark">P</div>
      <span class="header-title">PoliCita</span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="clear-btn" title="New conversation">
        <!-- Notepad / new chat icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme">
        <!-- Sun icon (shown in dark mode) / Moon icon (shown in light mode) -->
        <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="chat-window">
    <div class="chat-container" id="chat-container">
      <div class="welcome" id="welcome-screen">
        <div class="welcome-icon">P</div>
        <h1>PoliCita</h1>
        <p>Your guide through American Government. Ask about the syllabus, assignments, concepts, or anything from the course.</p>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-container">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="Ask PoliCita something..." autocomplete="off"></textarea>
        <button id="stop-btn" title="Stop generating">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button id="send-btn" title="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Press Enter to send · Shift + Enter for new line</div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    //  SETUP
    // ═══════════════════════════════════════════
    const chatWindow = document.getElementById("chat-window");
    const chatContainer = document.getElementById("chat-container");
    const welcomeScreen = document.getElementById("welcome-screen");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const clearBtn = document.getElementById("clear-btn");
    const themeToggle = document.getElementById("theme-toggle");
    const themeIconLight = document.getElementById("theme-icon-light");
    const themeIconDark = document.getElementById("theme-icon-dark");

    let conversationHistory = [];
    let currentAbortController = null;
    let isStreaming = false;

    // ═══════════════════════════════════════════
    //  MARKDOWN-IT SETUP
    // ═══════════════════════════════════════════
    const md = window.markdownit({
      html: false,
      linkify: true,
      typographer: true,
      breaks: true,
    });

    // ═══════════════════════════════════════════
    //  THEME TOGGLE
    // ═══════════════════════════════════════════
    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("policita-theme", theme);
      if (theme === "dark") {
        themeIconLight.style.display = "none";
        themeIconDark.style.display = "block";
      } else {
        themeIconLight.style.display = "block";
        themeIconDark.style.display = "none";
      }
    }

    // Load saved theme or detect system preference
    const savedTheme = localStorage.getItem("policita-theme");
    if (savedTheme) {
      setTheme(savedTheme);
    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      setTheme("dark");
    }

    themeToggle.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      setTheme(current === "dark" ? "light" : "dark");
    });

    // ═══════════════════════════════════════════
    //  AUTO-RESIZE TEXTAREA
    // ═══════════════════════════════════════════
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 160) + "px";
    });

    // ═══════════════════════════════════════════
    //  MESSAGE RENDERING
    // ═══════════════════════════════════════════
    function scrollToBottom() {
      chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: "smooth" });
    }

    function hideWelcome() {
      if (welcomeScreen) {
        welcomeScreen.style.display = "none";
      }
    }

    function addUserMessage(text) {
      hideWelcome();
      const row = document.createElement("div");
      row.className = "message-row user-row";
      const bubble = document.createElement("div");
      bubble.className = "message user-msg";
      bubble.textContent = text;
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      scrollToBottom();
    }

    function addTypingIndicator() {
      const row = document.createElement("div");
      row.className = "typing-row";
      row.id = "typing-indicator";
      row.innerHTML = `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
      chatContainer.appendChild(row);
      scrollToBottom();
      return row;
    }

    function createAgentMessage() {
      const row = document.createElement("div");
      row.className = "message-row agent-row";
      const bubble = document.createElement("div");
      bubble.className = "message agent-msg";
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      return bubble;
    }

    /**
     * Render markdown content, then post-process code blocks
     * to add copy buttons and language labels.
     */
    function renderMarkdown(el, text) {
      el.innerHTML = md.render(text);
      // Wrap all <pre> blocks with a header containing lang + copy btn
      el.querySelectorAll("pre").forEach(pre => {
        if (pre.parentElement.classList.contains("code-block-wrapper")) return;

        const code = pre.querySelector("code");
        let lang = "";
        if (code) {
          const match = code.className.match(/language-(\w+)/);
          if (match) lang = match[1];
        }

        const wrapper = document.createElement("div");
        wrapper.className = "code-block-wrapper";

        const header = document.createElement("div");
        header.className = "code-block-header";
        header.innerHTML = `
          <span class="code-lang">${lang || "code"}</span>
          <button class="copy-btn" onclick="copyCode(this)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        `;

        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);
      });
    }

    // ═══════════════════════════════════════════
    //  COPY CODE
    // ═══════════════════════════════════════════
    window.copyCode = function(btn) {
      const wrapper = btn.closest(".code-block-wrapper");
      const code = wrapper.querySelector("code");
      const text = code ? code.textContent : wrapper.querySelector("pre").textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied`;
        btn.classList.add("copied");
        setTimeout(() => {
          btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
          btn.classList.remove("copied");
        }, 2000);
      });
    };

    // ═══════════════════════════════════════════
    //  STREAMING + STOP
    // ═══════════════════════════════════════════
    function setStreamingState(streaming) {
      isStreaming = streaming;
      sendBtn.disabled = streaming;
      sendBtn.style.display = streaming ? "none" : "flex";
      stopBtn.classList.toggle("active", streaming);
    }

    function stopGeneration() {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      setStreamingState(false);
    }

    stopBtn.addEventListener("click", stopGeneration);

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message || isStreaming) return;

      userInput.value = "";
      userInput.style.height = "auto";
      addUserMessage(message);
      setStreamingState(true);

      const typingDiv = addTypingIndicator();
      currentAbortController = new AbortController();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_history: conversationHistory }),
          signal: currentAbortController.signal,
        });

        if (!response.ok) {
          typingDiv.remove();
          const data = await response.json();
          const errBubble = createAgentMessage();
          errBubble.textContent = `Error: ${data.detail || "Something went wrong"}`;
          setStreamingState(false);
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullReply = "";
        let agentDiv = null;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = line.slice(6).trim();
            if (data === "[DONE]") continue;

            try {
              const parsed = JSON.parse(data);
              const token = parsed.choices?.[0]?.delta?.content;
              if (token) {
                if (!agentDiv) {
                  typingDiv.remove();
                  agentDiv = createAgentMessage();
                }
                fullReply += token;
                renderMarkdown(agentDiv, fullReply);
                scrollToBottom();
              }
            } catch {
              // skip malformed chunks
            }
          }
        }

        if (!agentDiv) {
          typingDiv.remove();
          agentDiv = createAgentMessage();
          renderMarkdown(agentDiv, fullReply || "_No response received._");
        }

        conversationHistory.push({ role: "user", content: message });
        conversationHistory.push({ role: "assistant", content: fullReply });

      } catch (err) {
        typingDiv.remove();
        if (err.name === "AbortError") {
          // User stopped generation — keep partial response
          // The agentDiv already has partial content rendered
          conversationHistory.push({ role: "user", content: message });
          // Don't push partial assistant response to keep conversation clean
        } else {
          const errBubble = createAgentMessage();
          errBubble.textContent = "Connection error. Please check the server.";
        }
      } finally {
        currentAbortController = null;
        setStreamingState(false);
        userInput.focus();
      }
    }

    // ═══════════════════════════════════════════
    //  CLEAR CONVERSATION
    // ═══════════════════════════════════════════
    clearBtn.addEventListener("click", () => {
      if (isStreaming) stopGeneration();
      conversationHistory = [];
      chatContainer.innerHTML = "";
      // Restore welcome
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome-screen";
      welcome.innerHTML = `
        <div class="welcome-icon">P</div>
        <h1>PoliCita</h1>
        <p>Your guide through American Government. Ask about the syllabus, assignments, concepts, or anything from the course.</p>
      `;
      chatContainer.appendChild(welcome);
    });

    // ═══════════════════════════════════════════
    //  INPUT HANDLERS
    // ═══════════════════════════════════════════
    sendBtn.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Focus input on load
    userInput.focus();
  </script>
</body>
</html>
